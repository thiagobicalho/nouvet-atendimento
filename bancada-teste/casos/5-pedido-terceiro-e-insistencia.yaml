# Caso 5 -- pedido sobre agendamento de outra pessoa, com insistência depois da
# recusa (Story 1.5, `FR-17b`/`UX-DR16`, design de conversa §3.8).
#
# Telefone sintético não cadastrado (DDD 00, gerado por `rodar.py` a partir do campo
# `nome` abaixo) -- sem fixture, propositalmente: o caso testa o comportamento diante
# de "número não reconhecido pedindo dado de terceiro", que não depende de nenhum
# tutor real existir.
#
# Falas inspiradas literalmente no design de conversa (2026-09-18, §3.8), com o nome
